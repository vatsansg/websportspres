<div class="wtt-page">
  <div class="wtt-card wtt-narrow-card">
    <h2>Change Password</h2>
    <p class="wtt-subtitle">Update the password for your Super Admin account.</p>

    <form (ngSubmit)="submit()" #f="ngForm" novalidate>
      <div class="wtt-field">
        <label for="currentPassword">Current Password</label>
        <input
          id="currentPassword"
          name="currentPassword"
          type="password"
          [(ngModel)]="currentPassword"
          required
          autocomplete="current-password"
        />
      </div>
      <div class="wtt-field">
        <label for="newPassword">New Password</label>
        <input
          id="newPassword"
          name="newPassword"
          type="password"
          [(ngModel)]="newPassword"
          required
          minlength="8"
          autocomplete="new-password"
        />
        <span class="wtt-field-hint">At least 8 characters.</span>
      </div>
      <div class="wtt-field">
        <label for="confirmPassword">Confirm New Password</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          required
          autocomplete="new-password"
        />
      </div>

      @if (error()) {
        <p class="wtt-error" role="alert">{{ error() }}</p>
      }
      @if (success()) {
        <p class="wtt-success" role="status">Password changed successfully.</p>
      }

      <div class="wtt-actions">
        <button class="wtt-cta" type="submit" [disabled]="loading() || f.invalid">
          @if (loading()) {
            <span class="wtt-spinner" aria-hidden="true"></span>
          }
          Save
        </button>
        <button class="wtt-cta wtt-cta--secondary" type="button" (click)="back()">Cancel</button>
      </div>
    </form>
  </div>
</div>
